name: Research state unclaimed-property access

on:
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe candidate state sites
        run: node research_state_access.js
        working-directory: ingest
