name: Research state unclaimed-property access

on:
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe candidate state sites
        run: node research_state_access.js
        working-directory: ingest

      - name: Dig deeper on NY's search form
        run: node research_ny_search.js
        working-directory: ingest

      - name: Verify NAUPA/MissingMoney URLs
        run: node research_naupa.js
        working-directory: ingest

      - name: Verify CA safe-deposit-box auction program
        run: node research_sco_auctions.js
        working-directory: ingest
